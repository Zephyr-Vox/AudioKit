[package]
name = "audiokit-test"
description = "AudioKit CLI and optional Slint audio debugging workbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["processing-sonora", "codec-opus"]
processing-sonora = ["audiokit-testkit/processing-sonora"]
codec-opus = ["audiokit-testkit/codec-opus"]
native-cpal = ["audiokit-testkit/native-cpal", "dep:audiokit-platform"]
gui = ["dep:slint", "dep:slint-build", "dep:rfd", "dep:image", "native-cpal"]

[dependencies]
audiokit-testkit = { path = "../audiokit-testkit" }
serde_json.workspace = true
ctrlc.workspace = true
audiokit = { path = "../audiokit" }
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "accessibility"] }
rfd = { version = "=0.17.2", optional = true }
image = { version = "=0.25.8", optional = true, default-features = false, features = ["png"] }
audiokit-platform = { path = "../audiokit-platform", optional = true, features = ["native-cpal"] }
hound.workspace = true

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[lints]
workspace = true
