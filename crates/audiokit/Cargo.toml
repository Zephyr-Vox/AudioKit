[package]
name = "audiokit"
description = "Host-independent audio formats, processing contracts and DSP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["resampling"]
resampling = ["dep:rubato", "dep:audioadapter-buffers"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
rubato = { workspace = true, optional = true }
audioadapter-buffers = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[[example]]
name = "render_budget"
required-features = ["resampling"]
