[package]
name = "audiokit-platform"
description = "Optional native audio ports with bounded callback transports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
native-cpal = ["dep:cpal"]
windows-process-loopback = ["native-cpal", "dep:windows", "dep:windows-core"]

[dependencies]
audiokit = { path = "../audiokit", default-features = false }
cpal = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = { version = "=0.62.2", optional = true }
windows = { version = "=0.62.2", optional = true, features = [
    "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant",
] }

[lints]
workspace = true
