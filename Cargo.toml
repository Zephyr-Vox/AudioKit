[workspace]
members = ["crates/audiokit", "crates/audiokit-processing-sonora", "crates/audiokit-codec-opus", "crates/audiokit-platform", "crates/audiokit-testkit", "crates/audiokit-test"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
sonora = "=0.2.0"
opus = "=0.4.0"
rubato = "=4.0.0"
audioadapter-buffers = "=4.0.0"
cpal = "=0.18.2"
hound = "=3.5.1"
sha2 = "=0.10.9"
ctrlc = "=3.4.7"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
